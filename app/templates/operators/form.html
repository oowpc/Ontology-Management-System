{% extends "base.html" %}
{% block title %}{{ '编辑算子' if o and o.id else '新建算子' }}{% endblock %}
{% block content %}
<h1>{{ '编辑算子' if o and o.id else '新建算子' }}</h1>
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<form class="form" method="post">
  <label>名称 *
    <input name="name" value="{{ o.name if o else '' }}" required>
  </label>
  <div class="field">
    <span>主体概念 *</span>
    <div class="picker" data-picker="single" data-name="subject_concept_id"
         data-selected='{{ selected_subject|tojson }}'
         data-placeholder="搜索主体概念…"></div>
  </div>
  <div class="field">
    <span>所属概念（缺省 = 主体概念）</span>
    <div class="picker" data-picker="single" data-name="owner_concept_id"
         data-selected='{{ selected_owner|tojson }}'
         data-placeholder="搜索所属概念…"></div>
  </div>
  <label>参数类型列表（逗号 / 换行分隔）
    <textarea name="param_types" rows="3" placeholder="行政区划&#10;人">{{ ((o.param_types or [])|join('，')) if o else '' }}</textarea>
  </label>
  <label>返回类型 *
    <input name="return_type" value="{{ o.return_type if o else '' }}" placeholder="概念名 或 String / Number / Set[...]" required>
  </label>
  <div class="actions">
    <button class="btn primary" type="submit">保存</button>
    <a class="btn" href="/operators">取消</a>
  </div>
</form>
{% endblock %}
{% block scripts %}<script src="/static/picker.js?v=20261027a"></script>{% endblock %}
